[build]
  command = "npm run build"
  publish = ".next"

# ─── Global Security & SEO Headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # COOP for SharedArrayBuffer (COEP disabled for third-party compatibility)
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Cross-Origin-Embedder-Policy removed to allow AdSense and other cross-origin resources
    # Clickjacking protection
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy — must include ALL Google AdSense domains
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.googleadservices.com https://*.googletagservices.com https://*.googletagmanager.com https://*.google-analytics.com https://*.adtrafficquality.google https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://*.adtrafficquality.google https://*.googlesyndication.com; media-src 'self' blob:; connect-src 'self' blob: https: https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.googleadservices.com https://*.googletagservices.com https://*.googletagmanager.com https://*.google-analytics.com https://*.adtrafficquality.google https://stats.g.doubleclick.net; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://*.doubleclick.net https://*.google.com https://*.googlesyndication.com;"

# ─── Immutable cache for Next.js hashed bundles ──────────────────────────────
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Static images & WebP: 30-day cache with SWR ────────────────────────────
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# ─── Fonts: 1-year immutable cache ──────────────────────────────────────────
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── WASM binaries: 90-day immutable cache ───────────────────────────────────
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=7776000, immutable"

# ─── Manifest & service worker: short cache ─────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[plugins]]
  package = "@netlify/plugin-nextjs"
